name: Notes Domain Localization Cutover

on:
  push:
    branches:
      - fix/notes-domain-localization
    paths:
      - tools/migrations/localize_notes_domain.py
      - .github/workflows/notes-domain-localization-cutover.yml

permissions:
  contents: write

jobs:
  localize-domain:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/notes-domain-localization
          fetch-depth: 0

      - name: Apply exact domain localization codemod
        run: python3 tools/migrations/localize_notes_domain.py

      - name: Prove localized Notes domain and package boundaries
        run: |
          set -euo pipefail
          node --check apps/notes/src/domain/runtime.mjs
          node --check apps/notes/src/i18n/domain-messages.mjs
          node --check apps/notes/src/i18n/localization.mjs
          node --check apps/notes/src/runtime.mjs
          node --test apps/notes/tests/domain_localization.test.mjs
          node --test apps/notes/tests/app_data_store.test.mjs
          python3 apps/notes/tests/test_portable_boundary.py
          python3 tools/verify_notes_externalization.py
          python3 tools/verify_notes_package.py
          ! grep -n -E 'Meu espaço|Sem título| — cópia|Novo item|Referência' apps/notes/src/domain/runtime.mjs
          git diff --check

      - name: Commit the proven domain-only transformation
        env:
          BRANCH: fix/notes-domain-localization
        run: |
          set -euo pipefail
          git config user.name "washingtonmsdj"
          git config user.email "washingtonmsdj@gmail.com"
          git add apps/notes/src/domain/runtime.mjs
          git diff --cached --check
          git commit -m "Notes: localize persisted domain defaults"
          git push origin "HEAD:${BRANCH}"
