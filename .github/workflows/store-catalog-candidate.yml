name: Store Catalog Candidate

on:
  push:
    branches: [main]
    paths:
      - 'apps/**/app.json'
      - 'migrations/*.compatibility.json'
      - 'tools/app-package/**'
      - 'tests/test_store_catalog_candidate.py'
      - 'tests/test_store_catalog_publication.py'
      - '.github/workflows/store-catalog-candidate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**/app.json'
      - 'migrations/*.compatibility.json'
      - 'tools/app-package/**'
      - 'tests/test_store_catalog_candidate.py'
      - 'tests/test_store_catalog_publication.py'
      - '.github/workflows/store-catalog-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prove deterministic catalog boundaries
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/app-package/render_store_catalog_candidate.py \
            tools/app-package/render_store_catalog_publication.py
          python3 -m unittest \
            tests/test_store_catalog_candidate.py \
            tests/test_store_catalog_publication.py

      - name: Build exact Notes catalog input
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ordax-store-catalog-proof"
          rm -rf "$out"
          mkdir -p "$out/notes/release"

          python3 tools/app-package/build.py build \
            --app-root apps/notes \
            --source-commit "$GITHUB_SHA" \
            --compatibility migrations/notes.compatibility.json \
            --package-out "$out/notes/notes.zip" \
            --release-dir "$out/notes/release"

          python3 tools/app-package/build.py verify \
            --package "$out/notes/notes.zip" \
            --release "$out/notes/release/notes.release.json" \
            --compatibility "$out/notes/release/notes.compatibility.json"

          python3 tools/app-package/render_unsigned_handoff.py \
            --package "$out/notes/notes.zip" \
            --release "$out/notes/release/notes.release.json" \
            --compatibility "$out/notes/release/notes.compatibility.json" \
            --app-id notes \
            --source-commit "$GITHUB_SHA" \
            --out "$out/notes/notes.unsigned-candidate.json"

          python3 tools/app-package/render_store_catalog_candidate.py \
            --handoff "$out/notes/notes.unsigned-candidate.json" \
            --apps-root apps \
            --source-commit "$GITHUB_SHA" \
            --out "$out/store.catalog-candidate.json"

          python3 tools/app-package/render_store_catalog_publication.py \
            --candidate "$out/store.catalog-candidate.json" \
            --sequence 1 \
            --out "$out/store.catalog-publication.json"

      - name: Assert catalog boundaries remain authority-free
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ordax-store-catalog-proof"
          test -z "$(find "$out" -type f \( -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' -o -iname '*.pfx' \) -print -quit)"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'ordax-store-catalog-proof'
          candidate_path = root / 'store.catalog-candidate.json'
          publication_path = root / 'store.catalog-publication.json'

          candidate_bytes = candidate_path.read_bytes()
          candidate = json.loads(candidate_bytes.decode('utf-8'))
          publication = json.loads(publication_path.read_text(encoding='utf-8'))

          assert candidate['$schema'] == 'ordax-apps.store-catalog-candidate/1'
          assert candidate['status'] == 'unsigned-catalog-candidate'
          assert candidate['source'] == {
              'repository': 'washingtonmsdj/ordax-apps',
              'commit': os.environ['GITHUB_SHA'],
          }
          assert [entry['appId'] for entry in candidate['entries']] == ['notes']
          assert candidate['authority'] == {
              'signing': False,
              'publication': False,
              'installation': False,
              'activation': False,
              'rollback': False,
          }
          assert candidate['safety']['catalogGrantsAuthority'] is False
          assert candidate['safety']['platformLifecycleRequired'] is True
          assert candidate['safety']['requestSelectsArtifact'] is False
          assert candidate['safety']['requestSelectsVersion'] is False

          assert publication['$schema'] == 'ordax-apps.store-catalog-publication/1'
          assert publication['status'] == 'unsigned-publication-payload'
          assert publication['sequence'] == 1
          assert publication['source'] == candidate['source']
          assert publication['entries'] == candidate['entries']
          assert publication['trust'] == {
              'domain': 'runtime-components',
              'requiredKeyId': 'ordax-runtime-components-v1',
          }
          assert publication['provenance'] == {
              'candidateSchema': 'ordax-apps.store-catalog-candidate/1',
              'candidateSha256': hashlib.sha256(candidate_bytes).hexdigest(),
          }
          assert publication['authority'] == candidate['authority']
          assert publication['safety'] == {
              'requiresExternalSignature': True,
              'canonicalPublicAnchorRequired': True,
              'platformLifecycleRequired': True,
              'payloadGrantsAuthority': False,
          }
          print('ORDAX_STORE_CATALOG_AUTHORITY_BOUNDARY=PASS')
          PY

      - name: Upload public-only catalog artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ordax-store-catalog-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ordax-store-catalog-proof/store.catalog-candidate.json
            ${{ runner.temp }}/ordax-store-catalog-proof/store.catalog-publication.json
          if-no-files-found: error
          retention-days: 14
