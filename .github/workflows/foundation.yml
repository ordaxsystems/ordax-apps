name: OrdaX Apps Foundation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace-boundary:
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate canonical JSON syntax without hardcoded app inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool ordax-apps.workspace.json >/dev/null
          python3 -m json.tool platform-sdk.lock.json >/dev/null
          if [ -n "$(find apps migrations -type l -name '*.json' -print -quit)" ]; then
            echo "JSON symlinks are forbidden in app and migration trees" >&2
            exit 1
          fi
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find apps migrations -type f -name '*.json' -print0 | sort -z)

      - name: Prove repository boundary invariants
        run: python3 tools/verify_workspace.py

      - name: Guard OrdaX OS owner handoff and exact Platform SDK lock
        env:
          ORDAX_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest -v tests/test_platform_owner_handoff.py
          python3 tools/verify_platform_owner_handoff.py --require-post-transfer-source --require-physical-owner

      - name: Audit canonical app readiness and prove deterministic unsigned package candidates
        run: |
          python3 -m unittest tests/test_audit_app_readiness.py
          python3 tools/audit_app_readiness.py --format markdown --prove-package-candidates

      - name: Prove Files cutover stays blocked until platform source removal
        run: |
          python3 -m unittest tests/test_files_cutover.py
          python3 tools/verify_files_cutover.py --format markdown

      - name: Prove isolated first-party Finance domain without unapproved persistence
        run: |
          node --check apps/finance/src/domain/ledger.mjs
          node --test apps/finance/tests/ledger.test.mjs

      - name: Prove Notes externalization preflight
        run: python3 tools/verify_notes_externalization.py

      - name: Prove Projects externalization preflight
        run: |
          python3 -m unittest tests/test_projects_externalization.py
          python3 tools/verify_projects_externalization.py

      - name: Prove Notes-specific App SDK 1.6 pin
        run: python3 tools/verify_notes_platform_sdk.py

      - name: Prove deterministic external app package builder
        run: python3 -m unittest tests/test_app_package_builder.py tests/test_package_receipt_source_semantics.py tests/test_app_package_atomic_snapshot.py tests/test_package_zip_structure.py

      - name: Prove fail-closed Notes package cutover
        run: python3 tools/verify_notes_package.py

      - name: Prove portable Notes source boundary
        run: python3 apps/notes/tests/test_portable_boundary.py

      - name: Prove Notes App Data store
        run: node --test apps/notes/tests/app_data_store.test.mjs

      - name: Prove Notes text-file import
        run: node --test apps/notes/tests/file_import.test.mjs

      - name: Prove app-owned Notes behavior coverage
        run: |
          node --test apps/notes/tests/editor_save.test.mjs
          node --test apps/notes/tests/file_picker.test.mjs
          node --test apps/notes/tests/image_previews.test.mjs
          node --test apps/notes/tests/list_model.test.mjs
          node --test apps/notes/tests/reference_links.test.mjs
          node --test apps/notes/tests/runtime_core.test.mjs
          node --test apps/notes/tests/intelligence_summary.test.mjs
          python3 apps/notes/tests/test_deep_localization.py

      - name: Prove Notes production trust state transitions
        run: python3 -m unittest tests/test_notes_production_trust.py

      - name: Checkout pinned OrdaX OS production trust policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ordaxsystems/ordax-os
          ref: ef319ba940fa36c81699b73ba4195a178891e70f
          path: .ordax-platform-trust
          persist-credentials: false

      - name: Prove Notes production trust gate
        run: python3 tools/verify_notes_production_trust.py

      - name: Resolve pinned platform lifecycle owner
        id: lifecycle-lock
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          lock = json.loads(Path("migrations/notes.platform-lifecycle.lock.json").read_text(encoding="utf-8"))
          repository = lock.get("repository")
          commit = lock.get("commit")
          workspace = json.loads(Path("ordax-apps.workspace.json").read_text(encoding="utf-8"))
          canonical_repository = workspace["platform_repository"]
          assert repository == canonical_repository == "ordaxsystems/ordax-os"
          assert isinstance(commit, str) and re.fullmatch(r"[0-9a-f]{40}", commit)
          assert lock.get("tool_path") == "tools/runtime-component-channel"
          assert lock.get("authority") == "none"
          print(f"repository={canonical_repository}")
          print(f"commit={commit}")
          PY

      - name: Checkout pinned OrdaX OS lifecycle owner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.lifecycle-lock.outputs.repository }}
          ref: ${{ steps.lifecycle-lock.outputs.commit }}
          path: .ordax-platform-lifecycle
          persist-credentials: false

      - name: Verify pinned lifecycle checkout
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json; print(json.load(open("migrations/notes.platform-lifecycle.lock.json", encoding="utf-8"))["commit"])')"
          actual="$(git -C .ordax-platform-lifecycle rev-parse HEAD)"
          test "$actual" = "$expected"

      - name: Set up Go for platform lifecycle proof
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .ordax-platform-lifecycle/tools/runtime-component-channel/go.mod
          cache: false

      - name: Build real Notes component candidates
        run: |
          set -euo pipefail
          out="/tmp/ordax-notes-lifecycle"
          rm -rf "$out"
          mkdir -p "$out/current/release" "$out/failed/release" "$out/healthy/release"
          source_commit="$(git rev-parse HEAD)"
          failed_source_commit="1111111111111111111111111111111111111111"
          healthy_source_commit="2222222222222222222222222222222222222222"

          python3 tools/app-package/build.py build \
            --app-root apps/notes \
            --source-commit "$source_commit" \
            --compatibility migrations/notes.compatibility.json \
            --package-out "$out/current/notes.zip" \
            --release-dir "$out/current/release"
          python3 tools/app-package/build.py verify \
            --package "$out/current/notes.zip" \
            --release "$out/current/release/notes.release.json" \
            --compatibility "$out/current/release/notes.compatibility.json"

          python3 tools/app-package/build.py build \
            --app-root apps/notes \
            --source-commit "$failed_source_commit" \
            --compatibility migrations/notes.compatibility.json \
            --package-out "$out/failed/notes.zip" \
            --release-dir "$out/failed/release"
          python3 tools/app-package/build.py verify \
            --package "$out/failed/notes.zip" \
            --release "$out/failed/release/notes.release.json" \
            --compatibility "$out/failed/release/notes.compatibility.json"

          python3 tools/app-package/build.py build \
            --app-root apps/notes \
            --source-commit "$healthy_source_commit" \
            --compatibility migrations/notes.compatibility.json \
            --package-out "$out/healthy/notes.zip" \
            --release-dir "$out/healthy/release"
          python3 tools/app-package/build.py verify \
            --package "$out/healthy/notes.zip" \
            --release "$out/healthy/release/notes.release.json" \
            --compatibility "$out/healthy/release/notes.compatibility.json"

      - name: Prove Notes through canonical platform lifecycle
        env:
          ORDAX_NOTES_PACKAGE: /tmp/ordax-notes-lifecycle/current/notes.zip
          ORDAX_NOTES_RELEASE: /tmp/ordax-notes-lifecycle/current/release/notes.release.json
          ORDAX_NOTES_COMPATIBILITY: /tmp/ordax-notes-lifecycle/current/release/notes.compatibility.json
          ORDAX_NOTES_FAILED_UPDATE_PACKAGE: /tmp/ordax-notes-lifecycle/failed/notes.zip
          ORDAX_NOTES_FAILED_UPDATE_RELEASE: /tmp/ordax-notes-lifecycle/failed/release/notes.release.json
          ORDAX_NOTES_FAILED_UPDATE_COMPATIBILITY: /tmp/ordax-notes-lifecycle/failed/release/notes.compatibility.json
          ORDAX_NOTES_HEALTHY_UPDATE_PACKAGE: /tmp/ordax-notes-lifecycle/healthy/notes.zip
          ORDAX_NOTES_HEALTHY_UPDATE_RELEASE: /tmp/ordax-notes-lifecycle/healthy/release/notes.release.json
          ORDAX_NOTES_HEALTHY_UPDATE_COMPATIBILITY: /tmp/ordax-notes-lifecycle/healthy/release/notes.compatibility.json
          ORDAX_NOTES_RUNTIME: ${{ github.workspace }}/apps/notes/src/runtime.mjs
        run: |
          set -euo pipefail
          target=".ordax-platform-lifecycle/tools/runtime-component-channel/notes_external_integration_test.go"
          cp tests/notes_platform_lifecycle_integration_test.go "$target"
          trap 'rm -f "$target"' EXIT
          (
            cd .ordax-platform-lifecycle/tools/runtime-component-channel
            go test -run '^TestExternalNotesPackageCompletesCanonicalLifecycle$' -count=1
          )

      - name: Prove pinned public App SDK and all canonical app required contract majors
        run: |
          python3 -m unittest tests/test_app_sdk_compatibility.py
          python3 tools/verify_platform_sdk.py

      - name: Prove app intelligence against pinned public SDK
        run: python3 tools/verify_app_intelligence_sdk_conformance.py

      - name: Prove Application Actions against pinned public SDK
        run: python3 tools/verify_app_actions_sdk_conformance.py

      - name: Prove Studio public SDK conformance
        run: python3 tools/verify_studio_sdk_conformance.py

      - name: Prove Studio typed host bridge boundary
        run: node --test tests/studio_host_bridge_conformance.mjs

      - name: Prove Studio legacy method ownership boundary
        run: python3 tools/verify_studio_legacy_method_ownership.py

      - name: Prove portable Studio source boundary
        run: python3 apps/studio/tests/test_portable_boundary.py

      - name: Prove Studio grant selection and UTF-8 UI behavior
        run: |
          node --test apps/studio/tests/*.test.mjs
          python3 -m pip install --disable-pip-version-check pytest==9.1.1
          python3 -m pytest apps/studio/tests -q

      - name: Prove Studio remote Computer grant boundary
        run: python3 apps/studio/tests/test_remote_computer_grants_boundary.py

      - name: Prove Studio OrdaX OS and Windows distribution invariants
        run: |
          python3 tools/verify_studio_distribution.py
          python3 tests/studio_distribution_contract_test.py
  mvp-app-functional-minimum:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact app source for functional MVP proof
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Guard minimum MVP entry for all canonical app targets
        run: |
          python3 -m unittest tests/test_mvp_app_minimum.py tests/test_mvp_platform_ownership.py tests/test_platform_lifecycle_lock.py
          # Quality floor is a count (not an app-id inventory). Raise as apps
          # enter the catalog; never reduce it to mask missing candidates.
          python3 tools/verify_mvp_app_minimum.py --minimum-candidates 13 --format markdown

      - name: Prove minimum behavior and package for every canonical Store candidate
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # SSOT: exactly the same eligible component-slot entries consumed by
          # Store catalog generation. No second hand-maintained utility list.
          inventory="$(python3 tools/app-package/catalog_inventory.py --format tsv)"
          if [[ -z "$inventory" ]]; then
            echo "No canonical Store candidates were returned" >&2
            exit 1
          fi
          source_commit="$(git rev-parse HEAD)"
          while IFS=$'\t' read -r app app_root compatibility; do
            [[ -n "$app" && -n "$app_root" && -n "$compatibility" ]]
            [[ "$app_root" == "apps/$app" ]] || {
              echo "Noncanonical candidate root: $app_root" >&2
              exit 1
            }

            # A valid manifest/ZIP is not a functional app. Every candidate
            # must have behavior tests, including newly catalogued utilities.
            behavior_tests=("$app_root"/tests/*.test.mjs)
            if (( ${#behavior_tests[@]} == 0 )); then
              echo "$app: no executable behavior tests for the MVP" >&2
              exit 1
            fi
            node --check "$app_root/src/runtime.mjs"
            node --test "${behavior_tests[@]}"

            out="$RUNNER_TEMP/ordax-mvp-$app"
            mkdir -p "$out/release"
            python3 tools/app-package/build.py build \
              --app-root "$app_root" \
              --source-commit "$source_commit" \
              --compatibility "$compatibility" \
              --package-out "$out/$app.zip" \
              --release-dir "$out/release"
            python3 tools/app-package/build.py verify \
              --package "$out/$app.zip" \
              --release "$out/release/$app.release.json" \
              --compatibility "$out/release/$app.compatibility.json"
          done <<< "$inventory"


      - name: Prove real candidate-package runtime imports and missing-host-port denial
        run: |
          python3 -m unittest tests/test_packaged_runtime_smoke.py
          python3 tools/verify_packaged_runtimes.py --format markdown

      - name: Prove first-party app intelligence manifests
        run: python3 tools/verify_app_intelligence.py

      - name: Prove canonical file association ownership and package receipt
        run: |
          python3 -m unittest tests/test_file_associations.py
          python3 tools/verify_file_associations.py

      - name: Prove app-owned presentation manifests
        run: python3 tools/verify_app_presentation.py

      - name: Prove first-party Application Action manifests and provider artifacts
        run: |
          python3 -m unittest tests/test_provider_syntax_ssot.py
          python3 tools/verify_app_actions.py --check-provider-syntax

