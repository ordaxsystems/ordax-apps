name: Files External Package Candidate

on:
  pull_request:
    paths:
      - "apps/files/**"
      - "tools/app-package/**"
      - "platform-sdk.lock.json"
      - "migrations/files.externalization.json"
      - ".github/workflows/files-external-package.yml"
  push:
    branches: [main]
    paths:
      - "apps/files/**"
      - "tools/app-package/**"
      - "platform-sdk.lock.json"
      - "migrations/files.externalization.json"
      - ".github/workflows/files-external-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    name: Verify canonical Files ownership and Gate A
    runs-on: ubuntu-24.04
    outputs:
      gate_a_commit: ${{ steps.plan.outputs.gate_a_commit }}
      target_materialized: ${{ steps.plan.outputs.target_materialized }}
      package_allowed: ${{ steps.plan.outputs.package_allowed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate one Files ownership plan and negative cutover tests
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_files_cutover -v
          python3 tools/verify_files_cutover.py --format json > "$RUNNER_TEMP/files-cutover.json"
      - name: Classify package eligibility from the validated owner contract
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys
          from pathlib import Path

          plan = json.loads(Path("migrations/files.externalization.json").read_text(encoding="utf-8"))
          proof = json.loads((Path(os.environ["RUNNER_TEMP"]) / "files-cutover.json").read_text(encoding="utf-8"))
          allowed = plan["source_cutover_allowed"]
          state = plan["source_of_truth_state"]
          gate = plan["gate_a_platform_commit"]
          target = Path("apps/files")
          app_manifest = target / "app.json"
          if allowed is not True or not isinstance(gate, str) or len(gate) != 40:
              raise SystemExit("Files post-Gate-A plan is missing authorization or exact Gate A commit")
          print(f"gate_a_commit={gate}")

          if state == "source-absent-after-platform-removal":
              if plan["source_repository_current"] is not None or plan["source_path_current"] is not None:
                  raise SystemExit("Files absent-source state cannot name a current repository/path")
              if target.exists() or target.is_symlink():
                  raise SystemExit("Files target source exists while Gate B materialization is pending")
              if proof["source_state"] != state:
                  raise SystemExit("Files ownership proof disagrees with post-Gate-A source state")
              print("FILES_PACKAGE=GATE_B_SOURCE_PENDING", file=sys.stderr)
              print("target_materialized=false")
              print("package_allowed=false")
          elif state == "ordax-apps-canonical":
              if plan["source_repository_current"] != "ordaxsystems/ordax-apps":
                  raise SystemExit("Files canonical state must name ordax-apps")
              if plan["source_path_current"] != "apps/files" or not app_manifest.is_file():
                  raise SystemExit("Files canonical state requires materialized apps/files/app.json")
              print("target_materialized=true")
              print("package_allowed=true")
          else:
              raise SystemExit(f"Unsupported Files source state: {state}")
          PY
      - name: Inspect the exact canonical OS Gate A removal commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-os
          ref: ${{ steps.plan.outputs.gate_a_commit }}
          fetch-depth: 0
          path: .ordax-files-os-main
          persist-credentials: false
      - name: Verify actual OS Gate A removal and pinned source history
        run: |
          python3 tools/verify_files_cutover.py \
            --platform-root .ordax-files-os-main --require-cutover-ready

  package:
    name: Build unsigned Files candidate after verified Gate A
    needs: ownership
    if: needs.ownership.outputs.package_allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build canonical Files ZIP and unsigned lifecycle release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/files-release"
          python3 tools/app-package/build.py build \
            --app-root apps/files \
            --source-commit "$(git rev-parse HEAD)" \
            --compatibility apps/files/compatibility.json \
            --package-out "$RUNNER_TEMP/files.zip" \
            --release-dir "$RUNNER_TEMP/files-release"
      - name: Reverify actual ZIP and release through canonical builder
        run: |
          python3 tools/app-package/build.py verify \
            --package "$RUNNER_TEMP/files.zip" \
            --release "$RUNNER_TEMP/files-release/files.release.json" \
            --compatibility "$RUNNER_TEMP/files-release/files.compatibility.json"
      # Gate A only permits source materialization. This job runs only after
      # the plan has separately advanced to a materialized canonical Files source.
      # It still produces an unsigned candidate with no install/activation authority.
      - name: Produce deterministic unsigned handoff and verify candidate identity
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/files-unsigned"
          mkdir -p "$out"
          cp "$RUNNER_TEMP/files.zip" "$out/files.zip"
          cp "$RUNNER_TEMP/files-release/files.release.json" "$out/files.release.json"
          cp "$RUNNER_TEMP/files-release/files.compatibility.json" "$out/files.compatibility.json"
          python3 tools/app-package/render_unsigned_handoff.py \
            --package "$out/files.zip" \
            --release "$out/files.release.json" \
            --compatibility "$out/files.compatibility.json" \
            --app-id files \
            --source-commit "$GITHUB_SHA" \
            --out "$out/files.unsigned-candidate.json"
          (cd "$out" && sha256sum files.zip files.release.json files.compatibility.json files.unsigned-candidate.json > SHA256SUMS)
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          handoff = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "files-unsigned" / "files.unsigned-candidate.json").read_text()
          )
          assert handoff["status"] == "unsigned-candidate"
          assert handoff["component"]["id"] == "files"
          assert handoff["source"]["repository"] == "ordaxsystems/ordax-apps"
          assert handoff["source"]["commit"] == os.environ["GITHUB_SHA"]
          assert handoff["authority"] == {
              "signing": False, "publication": False,
              "installation": False, "activation": False,
          }
          PY

      - name: Save unsigned Files candidate, never install it automatically
        uses: actions/upload-artifact@v4
        with:
          name: files-unsigned-component-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/files-unsigned/files.zip
            ${{ runner.temp }}/files-unsigned/files.release.json
            ${{ runner.temp }}/files-unsigned/files.compatibility.json
            ${{ runner.temp }}/files-unsigned/files.unsigned-candidate.json
            ${{ runner.temp }}/files-unsigned/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
