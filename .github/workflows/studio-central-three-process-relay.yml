name: Studio Central Three-Process Relay

on:
  pull_request:
    paths:
      - "tools/assistant-host/proofs/relay-desktop-lab.mjs"
      - "tools/assistant-host/proofs/relay-desktop-client.mjs"
      - "apps/central/src/console.mjs"
      - "apps/central/src/chat-workspace.mjs"
      - "apps/central/src/receipt-projection.mjs"
      - "apps/central/src/turn-context.mjs"
      - "apps/central/src/studio-web-port.mjs"
      - "apps/central/tests/receipt-projection.test.mjs"
      - "apps/central/tests/chat-workspace.test.mjs"
      - "apps/central/tests/turn-context.test.mjs"
      - "apps/central/tests/studio-web-port.test.mjs"
      - "apps/central/tests/studio-web-bridge-native.test.mjs"
      - "tools/assistant-host/native/web-bridge.mjs"
      - "apps/central/README.md"
      - "docs/STUDIO-CENTRAL-THREE-PROCESS-LAB.md"
      - ".github/workflows/studio-central-three-process-relay.yml"
  push:
    branches: [main]
    paths:
      - "tools/assistant-host/proofs/relay-desktop-lab.mjs"
      - "tools/assistant-host/proofs/relay-desktop-client.mjs"
      - "apps/central/src/console.mjs"
      - "apps/central/src/chat-workspace.mjs"
      - "apps/central/src/receipt-projection.mjs"
      - "apps/central/src/turn-context.mjs"
      - "apps/central/src/studio-web-port.mjs"
      - "apps/central/tests/receipt-projection.test.mjs"
      - "apps/central/tests/chat-workspace.test.mjs"
      - "apps/central/tests/turn-context.test.mjs"
      - "apps/central/tests/studio-web-port.test.mjs"
      - "apps/central/tests/studio-web-bridge-native.test.mjs"
      - "tools/assistant-host/native/web-bridge.mjs"
      - "apps/central/README.md"
      - ".github/workflows/studio-central-three-process-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-windows-clients:
    name: Windows 3-process HTTP and Studio observation
    runs-on: windows-2025
    steps:
      - name: Checkout OrdaX Apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: apps
          persist-credentials: false
      - name: Checkout current OrdaX Platform main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-platform
          ref: main
          path: platform
          persist-credentials: false
      - name: Record exact Platform commit and require canonical Product owners
        shell: pwsh
        run: |
          $sha = (git -C platform rev-parse HEAD).Trim()
          if ($sha -notmatch '^[a-f0-9]{40}$') { throw 'Invalid Platform checkout commit' }
          if (!(Test-Path 'platform/control-plane/cloudflare/src/product_central_admission.ts')) { throw 'Platform Central admission owner missing' }
          if (!(Test-Path 'platform/control-plane/cloudflare/src/product_mcp_scoped.ts')) { throw 'Platform Product MCP scope owner missing' }
          "ORDAX_PLATFORM_MAIN_SHA=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "### Central / Platform checked version" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Platform main commit: $sha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host "ORDAX_PLATFORM_MAIN_SHA=$sha"
      - name: Install canonical PostgreSQL client for Product contract tests only
        shell: pwsh
        working-directory: platform/control-plane/cloudflare
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          if ($LASTEXITCODE -ne 0) { throw 'Platform PostgreSQL dependency install failed' }
      - name: Validate Product OAuth admission, grants and MCP receipts against current Platform
        shell: pwsh
        working-directory: platform
        run: |
          node --test control-plane/tests/product_central_admission.test.mts control-plane/tests/product_central_mcp.test.mts control-plane/tests/product_relay_canonical_mcp.test.mts control-plane/tests/product_relay_submit.test.mts control-plane/tests/product_relay_receipt.test.mts control-plane/labs/relay/scoped-mcp.test.mts
          if ($LASTEXITCODE -ne 0) { throw 'Current Product authorization contract failed' }
      - name: Run real Windows process and localhost HTTP acceptance proof
        shell: pwsh
        working-directory: apps
        run: |
          node --version
          node --test apps/central/tests/receipt-projection.test.mjs apps/central/tests/chat-workspace.test.mjs apps/central/tests/turn-context.test.mjs apps/central/tests/studio-web-port.test.mjs apps/central/tests/studio-web-bridge-native.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Central unit tests failed ($LASTEXITCODE)" }
          node tools/assistant-host/proofs/relay-desktop-lab.mjs --self-test --platform-root ../platform
          if ($LASTEXITCODE -ne 0) { throw "Central HTTP workbench failed ($LASTEXITCODE)" }
