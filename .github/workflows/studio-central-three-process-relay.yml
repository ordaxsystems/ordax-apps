name: Studio Central Three-Process Relay

on:
  pull_request:
    paths:
      - "tools/assistant-host/proofs/relay-desktop-lab.mjs"
      - "tools/assistant-host/proofs/relay-desktop-client.mjs"
      - "apps/central/src/console.mjs"
      - "apps/central/src/chat-workspace.mjs"
      - "apps/central/src/receipt-projection.mjs"
      - "apps/central/src/turn-context.mjs"
      - "apps/central/src/studio-web-port.mjs"
      - "apps/central/tests/receipt-projection.test.mjs"
      - "apps/central/tests/chat-workspace.test.mjs"
      - "apps/central/tests/turn-context.test.mjs"
      - "apps/central/tests/studio-web-port.test.mjs"
      - "apps/central/tests/studio-web-bridge-native.test.mjs"
      - "tools/assistant-host/native/web-bridge.mjs"
      - "apps/central/README.md"
      - "docs/STUDIO-CENTRAL-THREE-PROCESS-LAB.md"
      - ".github/workflows/studio-central-three-process-relay.yml"
  push:
    branches: [main]
    paths:
      - "tools/assistant-host/proofs/relay-desktop-lab.mjs"
      - "tools/assistant-host/proofs/relay-desktop-client.mjs"
      - "apps/central/src/console.mjs"
      - "apps/central/src/chat-workspace.mjs"
      - "apps/central/src/receipt-projection.mjs"
      - "apps/central/src/turn-context.mjs"
      - "apps/central/src/studio-web-port.mjs"
      - "apps/central/tests/receipt-projection.test.mjs"
      - "apps/central/tests/chat-workspace.test.mjs"
      - "apps/central/tests/turn-context.test.mjs"
      - "apps/central/tests/studio-web-port.test.mjs"
      - "apps/central/tests/studio-web-bridge-native.test.mjs"
      - "tools/assistant-host/native/web-bridge.mjs"
      - "apps/central/README.md"
      - ".github/workflows/studio-central-three-process-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-windows-clients:
    name: Windows 3-process HTTP and Studio observation
    runs-on: windows-2025
    steps:
      - name: Checkout OrdaX Apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: apps
          persist-credentials: false
      - name: Checkout canonical OrdaX Platform Relay pinned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ordaxsystems/ordax-platform
          ref: f0a2c4a41ea8f3d3b64bd3e4287b4dac1ce6894c
          path: platform
          persist-credentials: false
      - name: Run real Windows process and localhost HTTP acceptance proof
        shell: pwsh
        working-directory: apps
        run: |
          node --version
          node --test apps/central/tests/receipt-projection.test.mjs apps/central/tests/chat-workspace.test.mjs apps/central/tests/turn-context.test.mjs apps/central/tests/studio-web-port.test.mjs apps/central/tests/studio-web-bridge-native.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Central unit tests failed ($LASTEXITCODE)" }
          node tools/assistant-host/proofs/relay-desktop-lab.mjs --self-test --platform-root ../platform
          if ($LASTEXITCODE -ne 0) { throw "Central HTTP workbench failed ($LASTEXITCODE)" }
